<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>CardBEM</title>
    
</head>
<body>
    <div class="card">
        <img src="ASSETS/IMAGE/descarga.jpg" alt="" class="card__image">
        <div class="card__content">
            <h2 class="card__content__title">Aprendiz ADSO</h2>
            <p  class="card__content__descripcion">soy un aprendiz de Analisis y Desarrollo de Software, SOLO JAVA, lo demás es loma</p>
        </div>
        <div class="card__actions">
            <button class="card__actions__button card__actions__button--primary">Aceptar</button>
            <button class="card__actions__button card__actions__button--secundary">Cancelar</button>
        </div>
    </div>
</body>
</html>
